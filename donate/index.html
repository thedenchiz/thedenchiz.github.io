<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>reVine CRMP | Пополнение счета</title>
    
    <link rel="icon" href="/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #8a2be2;
            --primary-glow: rgba(138, 43, 226, 0.5);
            --bg-dark: #0a0a0e;
            --glass-matte: rgba(25, 25, 30, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --error: #ff4d4d;
            --warning: #ffb84d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
            display: flex; flex-direction: column; min-height: 100vh;
            align-items: center; justify-content: center;
        }

        /* --- ФОНОВЫЕ ЭЛЕМЕНТЫ (Из Main) --- */
        .bg-wrapper { position: fixed; inset: 0; z-index: -5; overflow: hidden; }
        #bg-video { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; transform: translate(-50%, -50%); opacity: 0.3; }
        .bg-overlay { position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(10,10,14,0.7) 0%, #0a0a0e 100%); z-index: -4; }

        .ambient-orb {
            position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.4; z-index: -3;
            animation: drift 15s infinite alternate ease-in-out; pointer-events: none;
        }
        .orb-1 { width: 400px; height: 400px; background: rgba(138, 43, 226, 0.35); top: -10%; left: -10%; }
        .orb-2 { width: 300px; height: 300px; background: rgba(70, 130, 180, 0.25); bottom: 10%; right: -5%; animation-delay: -5s; }

        @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 40px) scale(1.15); } }

        /* ТЕКСТ REVINE С ГРАДИЕНТОМ */
        .hero-bg-text {
            position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%);
            font-size: clamp(6rem, 22vw, 24rem); font-weight: 900;
            white-space: nowrap; user-select: none; pointer-events: none;
            letter-spacing: -1vw; z-index: -2;
            background: linear-gradient(180deg, #ffffff 0%, #a855f7 50%, #6b21a8 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            opacity: 0.15; filter: blur(2px);
        }

        /* --- НАВБАР --- */
        .floating-nav {
            position: fixed; z-index: 100;
            background: rgba(15, 15, 20, 0.7);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            display: flex; gap: 10px;
        }
        .nav-item { color: #aaa; text-decoration: none; padding: 10px; font-size: 1.5rem; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { color: #fff; transform: translateY(-3px); }
        .nav-item.active i { color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }

        /* --- ФОРМА ДОНАТА (MATTE GLASS) --- */
        .donate-container {
            background: var(--glass-matte);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px 30px; width: 90%; max-width: 420px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative; z-index: 10;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .donate-container h1 { margin-top: 0; font-size: 2rem; font-weight: 900; letter-spacing: 1px; margin-bottom: 5px; }
        .donate-container h1 i { color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }

        .input-group { margin-bottom: 24px; text-align: left; }
        .input-group label { display: block; margin-bottom: 10px; font-weight: 600; font-size: 0.85rem; color: #bbb; padding-left: 5px; }
        .input-group input {
            width: 100%; padding: 16px 20px; border-radius: 18px;
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff; font-family: 'Montserrat', sans-serif; font-size: 1.05rem;
            outline: none; transition: all 0.3s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow), inset 0 2px 5px rgba(0,0,0,0.2); background: rgba(0, 0, 0, 0.5); }
        
        .checkbox-group {
            display: flex; align-items: flex-start; gap: 12px; text-align: left;
            margin-bottom: 25px; background: rgba(0,0,0,0.2); padding: 15px; 
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.03);
        }
        .checkbox-group input[type="checkbox"] { margin-top: 4px; accent-color: var(--primary); width: 18px; height: 18px; flex-shrink: 0; cursor: pointer; }
        .checkbox-group label { font-size: 0.8rem; color: #aaa; line-height: 1.4; cursor: pointer; }

        /* Плашки ошибок */
        .alert-box {
            display: none; padding: 15px; border-radius: 16px; font-size: 0.85rem;
            margin-bottom: 20px; text-align: left; line-height: 1.5; font-weight: 600;
            backdrop-filter: blur(10px);
        }
        .alert-error { background: rgba(255, 77, 77, 0.1); border: 1px solid rgba(255, 77, 77, 0.3); color: #ffcccc; }
        .alert-warning { background: rgba(255, 184, 77, 0.1); border: 1px solid rgba(255, 184, 77, 0.3); color: #ffeecc; }

        /* МАТОВАЯ КНОПКА */
        .btn-pay {
            width: 100%; padding: 18px; border-radius: 18px; font-weight: 800; font-size: 1.05rem;
            background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--glass-border);
            cursor: pointer; transition: all 0.4s cubic-bezier(0.2, 0, 0, 1);
            text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-pay:hover:not(:disabled) { 
            background: rgba(255, 215, 0, 0.15); border-color: transparent; 
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2); transform: translateY(-3px); color: #ffd700;
        }
        .btn-pay:disabled { background: rgba(0,0,0,0.4); color: #666; cursor: not-allowed; border-color: rgba(255,255,255,0.02); }

        /* --- АДАПТИВНОСТЬ --- */
        @media (max-width: 768px) {
            .hero-bg-text { top: 30%; transform: translate(-50%, -50%) scaleY(1.4); opacity: 0.2; font-size: 28vw; }
            .floating-nav { bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; border-radius: 50px; padding: 10px; justify-content: space-around; }
            body { padding-bottom: 80px; }
            .donate-container { padding: 30px 20px; }
        }

        @media (min-width: 769px) {
            .floating-nav { top: 50%; right: 30px; transform: translateY(-50%); flex-direction: column; padding: 25px 15px; border-radius: 40px; }
        }
    </style>
</head>
<body>
    
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="bg-wrapper">
        <video autoplay loop muted playsinline id="bg-video"><source src="/background.mp4" type="video/mp4"></video>
    </div>
    <div class="bg-overlay"></div>

    <div class="hero-bg-text">REVINE</div>

    <nav class="floating-nav">
        <a href="/" class="nav-item"><i class="fa-solid fa-house"></i></a>
        <a href="/archive/" class="nav-item"><i class="fa-solid fa-box-archive"></i></a>
        <a href="/donate/" class="nav-item active"><i class="fa-solid fa-gem"></i></a>
    </nav>

    <div class="donate-container">
        <h1><i class="fa-solid fa-gem"></i> Пополнение</h1>
        <p style="color: #aaa; margin-bottom: 30px; font-size: 0.9rem; font-weight: 500;">Средства зачисляются автоматически</p>
        
        <form id="donate-form" action="/donate/pay.php" method="POST">
            
            <div id="warning-box" class="alert-box alert-warning"></div>
            <div id="error-box" class="alert-box alert-error"></div>

            <div class="input-group">
                <label for="nickname">Никнейм в игре</label>
                <input type="text" id="nickname" name="nickname" placeholder="Ivan_Ivanov" required autocomplete="off">
            </div>
            
            <div class="input-group">
                <label for="amount">Сумма (Рубли)</label>
                <input type="number" id="amount" name="amount" min="10" placeholder="100" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="confirm_nick" required>
                <label for="confirm_nick">Я внимательно проверил никнейм и подтверждаю, что он введен верно. Претензий при ошибке иметь не буду.</label>
            </div>

            <button type="submit" class="btn-pay" id="submit-btn"><i class="fa-solid fa-bolt"></i> Перейти к оплате</button>
        </form>
    </div>

    <script>
        const nickInput = document.getElementById('nickname');
        const form = document.getElementById('donate-form');
        const warningBox = document.getElementById('warning-box');
        const errorBox = document.getElementById('error-box');
        const submitBtn = document.getElementById('submit-btn');
        let isNickValid = false;

        function formatNickname(val) {
            val = val.replace(/\s+/g, '');
            val = val.replace(/_+/g, '_');
            let parts = val.split('_');
            for(let i = 0; i < parts.length; i++) {
                if(parts[i].length > 0) {
                    parts[i] = parts[i].charAt(0).toUpperCase() + parts[i].slice(1).toLowerCase();
                }
            }
            return parts.join('_');
        }

        nickInput.addEventListener('blur', async function() {
            let originalVal = this.value;
            if(!originalVal) return;

            let formattedVal = formatNickname(originalVal);
            this.value = formattedVal; 

            if (!formattedVal.includes('_')) {
                warningBox.innerHTML = `Если ваш ник выглядит как <b>${originalVal}</b>, то сначала измените его в игре на формат Имя_Фамилия (например: Ivan_Ivanov).`;
                warningBox.style.display = 'block';
            } else {
                warningBox.style.display = 'none';
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Проверка...';
            errorBox.style.display = 'none';

            try {
                let response = await fetch('check_nick.php?nick=' + encodeURIComponent(formattedVal));
                let data = await response.json();

                if (!data.exists) {
                    errorBox.innerHTML = `Аккаунт <b>${formattedVal}</b> не найден в базе данных! Зайдите на сервер хотя бы один раз.`;
                    errorBox.style.display = 'block';
                    isNickValid = false;
                } else {
                    isNickValid = true;
                }
            } catch (err) {
                console.error("Ошибка при проверке:", err);
                isNickValid = true; 
            }

            submitBtn.disabled = !isNickValid;
            submitBtn.innerHTML = '<i class="fa-solid fa-bolt"></i> Перейти к оплате';
        });

        form.addEventListener('submit', function(e) {
            if (!isNickValid) {
                e.preventDefault();
                nickInput.focus();
            }
        });
    </script>
</body>
</html>
